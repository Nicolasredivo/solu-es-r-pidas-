<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Soluções Rápidas</title>
  <meta name="theme-color" content="#0f1220" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="gate-view" class="gate-view">
    <div class="card">
      <h1>Soluções Rápidas</h1>
      <p class="subtitle">Digite a senha para acessar</p>

      <form id="test-form">
        <label for="password">Senha de acesso</label>
        <input type="password" id="password" placeholder="Digite a senha" required />

        <label class="checkbox-linha">
          <input type="checkbox" id="lembrar-senha" />
          <span>Lembrar neste aparelho</span>
        </label>

        <button type="submit" id="test-button">Entrar</button>
      </form>

      <div id="status" class="status"></div>

      <button type="button" id="toggle-config" class="link-button">⚙ Endereço do n8n</button>

      <div id="config-box" class="config-box hidden">
        <label for="n8n-url">Endereço do túnel (Cloudflare)</label>
        <input type="text" id="n8n-url" placeholder="https://algo.trycloudflare.com" autocomplete="off" />
        <div class="config-acoes">
          <button type="button" id="salvar-url">Salvar</button>
          <button type="button" id="restaurar-url" class="botao-secundario">Restaurar padrão</button>
        </div>
        <p id="config-hint" class="config-hint"></p>
      </div>
    </div>
  </div>

  <div id="app-view" class="app-view hidden">
    <div class="topbar">
      <button type="button" id="menu-button" class="menu-button" aria-label="Abrir menu" aria-expanded="false">☰</button>
      <span class="topbar-title">Soluções Rápidas</span>
    </div>

    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <nav id="sidebar" class="sidebar">
      <button type="button" class="sidebar-item active" data-page="inicio">Início</button>
      <button type="button" class="sidebar-item" data-page="cadastro">Cadastro</button>
    </nav>

    <main class="main-content">
      <div id="page-inicio" class="card page">
        <h1>Início</h1>
        <p class="subtitle">Conectado com sucesso ✅</p>
        <p class="placeholder-text">Em breve, mais opções aparecem aqui.</p>
      </div>

      <div id="page-cadastro" class="card page hidden">
        <h1>Cadastro</h1>

        <div class="subtabs">
          <button type="button" class="subtab active" data-subpage="adicionar">Adicionar</button>
          <button type="button" class="subtab" data-subpage="consultar">Consultar</button>
        </div>

        <div id="subpage-adicionar" class="subpage">
          <label for="documento">CPF ou CNPJ</label>
          <input type="text" id="documento" inputmode="numeric" autocomplete="off"
                 placeholder="Digite o CPF ou CNPJ" />
          <div id="documento-hint" class="doc-hint"></div>

          <div id="tipo-cnpj" class="grupo hidden">
            <label>É condomínio ou empresa?</label>
            <div class="opcoes" id="grupo-tipo">
              <button type="button" class="opcao" data-valor="CNPJ - Condomínio">Condomínio</button>
              <button type="button" class="opcao" data-valor="CNPJ - Empresa">Empresa</button>
            </div>
          </div>

          <div id="aviso-existe" class="aviso hidden"></div>

          <form id="form-entidade" class="hidden">
            <label for="razao-social">Razão social / Nome</label>
            <input type="text" id="razao-social" required />

            <label for="nome-fantasia">Nome fantasia / Identificador</label>
            <input type="text" id="nome-fantasia" />

            <div class="grupo">
              <label>Exigência fiscal</label>
              <div class="opcoes" id="grupo-exigencia">
                <button type="button" class="opcao" data-valor="Exige Nota Fiscal">Nota fiscal</button>
                <button type="button" class="opcao" data-valor="Apenas Recibo">Apenas recibo</button>
              </div>
            </div>

            <label for="emails">E-mails (financeiro / NF-e)</label>
            <input type="text" id="emails" />

            <label for="whatsapp">WhatsApp financeiro</label>
            <input type="text" id="whatsapp" />

            <label for="administradora">Administradora</label>
            <input type="text" id="administradora" />

            <div class="grupo">
              <label>Status</label>
              <div class="opcoes" id="grupo-status">
                <button type="button" class="opcao active" data-valor="Ativo">Ativo</button>
                <button type="button" class="opcao" data-valor="Inativo">Inativo</button>
              </div>
            </div>

            <label for="observacoes">Observações</label>
            <textarea id="observacoes" rows="3"></textarea>

            <button type="submit" id="salvar-entidade">Salvar cadastro</button>
            <div id="salvar-status" class="status"></div>
          </form>
        </div>

        <div id="subpage-consultar" class="subpage hidden">
          <p class="placeholder-text">Em construção — em breve você vai poder buscar cadastros aqui.</p>
        </div>
      </div>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>

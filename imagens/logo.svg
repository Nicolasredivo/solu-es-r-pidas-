<?xml version="1.0" encoding="UTF-8"?>
<!--
  Monograma "SR" da Soluções Rápidas.

  SUBSTITUTO, não a marca oficial: o logo original não estava no projeto
  (só havia os dois ícones de PWA, que são um círculo azul de exemplo), e
  este desenho foi feito a partir da imagem da marca, nas cores dela.

  PRA COLOCAR O LOGO DE VERDADE: sobrescreva este arquivo pelo original
  (mantendo o nome imagens/logo.svg) ou salve como imagens/logo.png e
  troque a extensão no <img> do index.html. Mais nada precisa mudar.

  Cores: #0B1E3D marinho · #1C4E85 azul · #3E8FD1 azul-aço · #B9C2C9 prata
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 104" width="150" height="104" role="img" aria-label="Soluções Rápidas">
  <defs>
    <linearGradient id="grad-s" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1C4E85" />
      <stop offset="55%" stop-color="#0B1E3D" />
      <stop offset="100%" stop-color="#0B1E3D" />
    </linearGradient>
    <linearGradient id="grad-s-dobra" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#3E8FD1" />
      <stop offset="100%" stop-color="#1C4E85" />
    </linearGradient>
    <linearGradient id="grad-r" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1E3D" />
      <stop offset="100%" stop-color="#1C4E85" />
    </linearGradient>
    <linearGradient id="grad-r-faceta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B9C2C9" />
      <stop offset="100%" stop-color="#6E7C8C" />
    </linearGradient>
  </defs>

  <!-- "S" em fita dobrada: barra de cima, diagonal e barra de baixo -->
  <path d="M14 26 L52 4 L96 4 L96 26 Z" fill="url(#grad-s-dobra)" />
  <path d="M14 26 L60 26 L26 62 L14 62 Z" fill="url(#grad-s)" />
  <path d="M26 62 L60 26 L84 40 L48 78 Z" fill="url(#grad-s)" />
  <path d="M0 100 L26 74 L84 74 L58 100 Z" fill="url(#grad-s)" />
  <path d="M48 78 L84 40 L84 74 L58 100 Z" fill="url(#grad-s-dobra)" opacity=".85" />

  <!-- "R" angular: haste, bojo quadrado e perna diagonal -->
  <path d="M86 4 L122 4 L144 26 L144 48 L122 68 L86 68 Z" fill="url(#grad-r)" />
  <path d="M104 22 L120 22 L126 30 L126 42 L120 50 L104 50 Z" fill="#FFFFFF" />
  <path d="M112 56 L134 56 L148 100 L124 100 Z" fill="url(#grad-r)" />
  <path d="M86 4 L122 4 L144 26 L124 26 L108 12 L86 12 Z" fill="url(#grad-r-faceta)" opacity=".55" />
</svg>
